name: T Hoo Hoo three music charts
on:
  push:
    branches: [fan-thoo-color-doll-20261116]
    paths: [protoface/thoo-three-charts-20261116/request.json]
permissions:
  contents: read
concurrency:
  group: thoo-three-charts-20261116
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'httpx>=0.27,<1' 'jsonschema>=4.23,<5'
      - name: Generate the five approved comedy scenes
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/thoo-three-charts-20261116/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thoo-three-charts-${{ github.run_id }}
          path: thoo-three-charts-output/
          retention-days: 7
