name: Xie beautiful fight comparison
on:
  push:
    branches: [xie-beautiful-fight-ab-20261117]
    paths: [protoface/xie-beautiful-ab/request.json]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - name: Generate two authorized five second samples
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/xie-beautiful-ab/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xie-beautiful-fight-samples
          path: protoface/xie-beautiful-ab/output
