name: Episodes 02-10 read-only price and funding check
on:
  push:
    paths: ['protoface/ep02-10/inspect-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install request and encryption libraries
        run: python -m pip install --timeout 30 --retries 1 httpx==0.28.1 cryptography==50.0.0
      - name: Read model pricing and funding without generating media
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep02-10/batch_preflight.py
      - name: Return the encrypted check result
        uses: actions/upload-artifact@v4
        with:
          name: EP02-10-read-only-preflight-${{ github.run_id }}
          path: protoface/ep02-10/preflight-output/preflight.sealed.json
          retention-days: 7
