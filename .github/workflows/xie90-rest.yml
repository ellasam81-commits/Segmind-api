name: Xie 90s remaining segments
on:
  push:
    branches: [xie-beautiful-fight-ab-20261117]
    paths: [protoface/xie90/request-02.json]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - name: Wan final story segments
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/xie90/runner.py request-02.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xie90-rest
          path: output
