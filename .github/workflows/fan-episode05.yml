name: Fan episode five
on:
  push:
    branches: [fan-hetongzhoudu-20261116]
    paths: [protoface/hetongzhoudu-episode05-20261116/request.json]
permissions:
  contents: read
concurrency:
  group: fan-episode05-20261116
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate fifth fan film
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/hetongzhoudu-episode05-20261116/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode05-${{ github.run_id }}
          path: hetongzhoudu-episode05-output/
          retention-days: 7
