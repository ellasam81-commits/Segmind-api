name: Thirteen Doors41-45 read-only native preflight
on:
  push:
    paths: ['protoface/ep41-45/check-request.json']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing transport dependencies
        run: python -m pip install --timeout 30 --retries 1 httpx==0.28.1 cryptography==50.0.0
      - name: Check original provider read-only
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep41-45/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: TD4145-preflight-${{ github.run_id }}
          path: protoface/ep41-45/preflight.sealed.json
          retention-days: 2
