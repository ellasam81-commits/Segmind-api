name: EP01 H3 suspense first segment - 480p
on:
  push:
    paths: ['protoface/ep01/h3-suspense-request.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r protoface/ep01/requirements.txt
      - name: Restore this same accepted trial if resuming
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ep01-h3-suspense-checkpoint-${{ github.run_id }}
          path: protoface/ep01/h3-test/checkpoint
      - name: Generate one requested fifteen-second suspense trial
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'true'
        run: python protoface/ep01/h3_trial.py
      - name: Preserve the accepted provider run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-h3-suspense-checkpoint-${{ github.run_id }}
          path: protoface/ep01/h3-test/checkpoint
          overwrite: true
          if-no-files-found: ignore
      - name: Download this H3 trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-h3-suspense-480p-sample-${{ github.run_id }}
          path: |
            protoface/ep01/h3-test/*.mp4
            protoface/ep01/h3-test/prompt.txt
            protoface/ep01/h3-test/completion.json
            protoface/ep01/h3-test/minimax-h3-contract.json
          if-no-files-found: ignore
