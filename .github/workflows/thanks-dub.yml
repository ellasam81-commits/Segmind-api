name: Record the four-chart thank-you sketch
on:
  push:
    branches: [thoo-four-chart-thanks]
    paths: ['.github/workflows/thanks-dub.yml']
permissions:
  contents: read
jobs:
  dub:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q edge-tts
          mkdir speech
          python - <<'PY'
          import asyncio, edge_tts
          async def main():
              for i,line in enumerate(["哎呀，还差一张！","接住啦！四张，都是小炭火一起攒的。","谢谢每一位小炭火！"]):
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(line,'zh-CN-YunxiNeural' if i==1 else 'zh-CN-XiaoyiNeural',rate='+6%',pitch='+4Hz' if i else '+0Hz').save(f'speech/{i}.mp3')
                          break
                      except Exception:
                          if attempt==2: raise
                          await asyncio.sleep(2)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thanks-speech
          path: speech/*.mp3
