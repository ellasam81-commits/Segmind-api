name: Handsome anime T Hoo Hoo fan skit
on:
  push:
    branches: [fan-hangbo-anime-20261115]
    paths: [protoface/hangbo-anime-20261115/request.json]
permissions:
  contents: read
concurrency:
  group: fan-hangbo-anime-20261115
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'httpx>=0.27,<1' 'jsonschema>=4,<5'
      - name: Generate reviewed fan skit phase
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/hangbo-anime-20261115/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hangbo-anime-${{ github.run_id }}
          path: hangbo-anime-output/
          retention-days: 7
