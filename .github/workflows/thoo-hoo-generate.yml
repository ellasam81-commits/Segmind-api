name: T Hoo Hoo - approved five-part tutorial
on:
  push:
    paths:
      - 'protoface/thoo-hoo-qqmusic/generation-request.json'
permissions:
  contents: read
concurrency:
  group: thoo-hoo-approved-tutorial
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r protoface/thoo-hoo-qqmusic/requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: thoo-hoo-five-parts-${{ github.run_id }}
          path: thoo-hoo-output
      - name: Generate only authorized T Hoo Hoo parts
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/thoo-hoo-qqmusic/batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thoo-hoo-five-parts-${{ github.run_id }}
          path: thoo-hoo-output/
          overwrite: true
          retention-days: 7
