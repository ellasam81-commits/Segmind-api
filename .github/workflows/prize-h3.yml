name: H3 prize theatre
on:
  push:
    branches: [fan-prize-h3-20261118]
    paths: ['.github/workflows/prize-h3.yml', 'prize/run.py']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Protoface H3 connection
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          req = urllib.request.Request('https://api.protoface.com/v1/models/minimax/minimax-h3', headers={'Authorization':'Bearer '+os.environ['PROTOFACE_API_KEY']})
          with urllib.request.urlopen(req, timeout=45) as reply:
              print('H3 model lookup HTTP',reply.status)
          PY
      - name: Check media tools
        timeout-minutes: 5
        run: |
          set -eu
          python -c "import PIL, requests" || python -m pip install --timeout 20 --retries 1 Pillow requests
          which ffmpeg && test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc || sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y ffmpeg fonts-noto-cjk
      - name: Resume eight H3 scenes using original request keys
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python -u prize/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chibi-Prize-Theatre
          path: output/*.mp4
          if-no-files-found: error
