name: Thirteen Doors existing files recovery READ ONLY
on:
  push:
    paths: ['protoface/ep51-60-recovery/request.json']
permissions:
  contents: read
concurrency:
  group: td5160-existing-recovery-only
  cancel-in-progress: false
jobs:
  recover-existing-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install encryption only
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Read existing paid outputs, never generate
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'false'
        run: python protoface/ep51-60-recovery/recover_existing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TD5160-readonly-recovery-probe-${{ github.run_id }}
          path: protoface/ep51-60-recovery/sealed/probe.sealed.json
          retention-days: 7
          if-no-files-found: error
