name: Thirteen Doors36-40 reviewed native production
on:
  push:
    paths: ['protoface/ep36-40/generate-request.json']
  workflow_dispatch:
    inputs:
      episode:
        description: Authorized initial episode or all five
        required: true
        type: choice
        default: all
        options: ['all', '36', '37', '38', '39', '40']
permissions:
  contents: read
  actions: read
concurrency:
  group: thirteen-doors-ep36-40-initial
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.select.outputs.episodes }}
      initial_parts: ${{ steps.select.outputs.initial_parts }}
      repair_parts: ${{ steps.select.outputs.repair_parts }}
      repair_id: ${{ steps.select.outputs.repair_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECT_EPISODE: ${{ inputs.episode || 'all' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          if os.environ['EVENT_NAME']=='push':
              data=json.loads(Path('protoface/ep36-40/generate-request.json').read_text())
              episodes=data['episodes'];parts=data.get('initial_parts',[])
              repair_parts=data.get('repair_parts',[]);repair_id=data.get('repair_request_id','')
              kind=data.get('request_kind','initial')
              assert kind in ('initial','repair')
              assert bool(repair_parts)==bool(repair_id)
              assert (kind=='repair')==bool(repair_parts)
              assert not(parts and repair_parts)
              assert data['maximum_credits_per_clip']==8
          else:
              choice=os.environ['SELECT_EPISODE']
              episodes=list(range(36,41)) if choice=='all' else [int(choice)];parts=[];repair_parts=[];repair_id=''
          assert episodes and len(episodes)==len(set(episodes)) and all(type(e)is int and e in range(36,41) for e in episodes)
          selected_range=range(1,17) if episodes==[37] else range(1,13)
          assert len(parts)==len(set(parts)) and all(type(n)is int and n in selected_range for n in parts)
          assert len(repair_parts)==len(set(repair_parts)) and all(type(n)is int and n in selected_range for n in repair_parts)
          assert not repair_parts or len(episodes)==1
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('episodes='+json.dumps(episodes,separators=(',',':'))+'\n')
              out.write('initial_parts='+','.join(str(n) for n in parts)+'\n')
              out.write('repair_parts='+','.join(str(n) for n in repair_parts)+'\n')
              out.write('repair_id='+repair_id+'\n')
          PY
  episode:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: ${{ fromJSON(needs.selection.outputs.episodes) }}
    env:
      INITIAL_PARTS: ${{ needs.selection.outputs.initial_parts }}
      REVIEWED_REPAIR_PARTS: ${{ needs.selection.outputs.repair_parts }}
      REVIEWED_REPAIR_ID: ${{ needs.selection.outputs.repair_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare existing native media tools
        run: |
          python -m pip install --timeout 30 --retries 1 httpx==0.28.1 jsonschema==4.26.0 cryptography==50.0.0 imageio-ffmpeg==0.6.0
          python protoface/ep36-40/install_media_tools.py
      - name: Prepare encrypted channel and check live price only
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep36-40/series_runner.py init --episode ${{ matrix.episode }} --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td36-40-${{ matrix.episode }}'
      - uses: actions/upload-artifact@v4
        with:
          name: TD3640-ready-ep${{ matrix.episode }}-${{ github.run_id }}
          path: protoface/ep36-40/transport-public/ep${{ matrix.episode }}/
          retention-days: 1
      - name: Receive reviewed encrypted references and prompts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python protoface/ep36-40/series_runner.py receive --episode ${{ matrix.episode }} --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td36-40-${{ matrix.episode }}' --repository '${{ github.repository }}'
      - name: Generate only selected initial native slots or poll accepted runs
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'true'
        run: |
          if [ -n "$REVIEWED_REPAIR_PARTS" ]; then
            python protoface/ep36-40/series_runner.py generate --episode ${{ matrix.episode }} --parts "$REVIEWED_REPAIR_PARTS"
          else
            python protoface/ep36-40/series_runner.py generate --episode ${{ matrix.episode }}
          fi
      - name: Encrypt returned original media and request checkpoints
        if: always()
        run: python protoface/ep36-40/series_runner.py seal --episode ${{ matrix.episode }} --run-id ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TD3640-results-ep${{ matrix.episode }}-${{ github.run_id }}
          path: protoface/ep36-40/sealed-results/ep${{ matrix.episode }}.sealed.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral plaintext and input key
        if: always()
        env:
          TD_EPISODE: ${{ matrix.episode }}
          TD_PRIVATE_DIR: ${{ runner.temp }}/td36-40-${{ matrix.episode }}
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          shutil.rmtree(os.environ['TD_PRIVATE_DIR'],ignore_errors=True)
          shutil.rmtree(Path('protoface/ep36-40/work')/('ep'+os.environ['TD_EPISODE']),ignore_errors=True)
          PY
