name: Record T Hoo Hoo dialogue
on:
  push:
    branches: [thoo-watch-replay-nov19]
    paths: ['.github/workflows/thoo-watch-dialogue.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          pip install -q edge-tts
          mkdir recordings
          python - <<'PY'
          import asyncio, edge_tts
          lines=["谢却山不曾叛国。"]
          async def main():
              for i,line in enumerate(lines):
                  rate='-8%'
                  pitch='+2Hz'
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(line,'zh-CN-YunxiNeural',rate=rate,pitch=pitch).save(f'recordings/loyalty.mp3')
                          break
                      except Exception:
                          if attempt==2: raise
                          await asyncio.sleep(2)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watch-dialogue
          path: recordings/*.mp3
