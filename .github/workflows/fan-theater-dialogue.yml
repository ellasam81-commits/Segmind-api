name: Check fan theater dialogue
on:
  push:
    branches: [fan-theater-1111-black-shirt]
    paths: ['protoface/fan-theater-1111/check-voice.py']
permissions:
  contents: read
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q faster-whisper
      - name: Align the existing performance dialogue
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/fan-theater-1111/check-voice.py
