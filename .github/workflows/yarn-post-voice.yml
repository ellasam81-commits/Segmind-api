name: Yarn post miniature voices
on:
  push:
    branches: [fan-theater-1112-yarn-post]
    paths: ['fan-theater/yarn-post/voice.py']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q edge-tts
          python fan-theater/yarn-post/voice.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fan-theater/yarn-post/audio
          git commit -m "Return the yarn characters' Mandarin lines"
          git push
