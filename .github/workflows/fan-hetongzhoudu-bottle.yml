name: 何不同舟渡 · 先把瓶盖打开
on:
  push:
    branches: [fan-hetongzhoudu-20261116]
    paths: [protoface/hetongzhoudu-bottle-20261116/request.json]
permissions:
  contents: read
concurrency:
  group: fan-hetongzhoudu-bottle-20261116
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'httpx>=0.27,<1' 'jsonschema>=4,<5'
      - name: Generate requested fan adaptation
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/hetongzhoudu-bottle-20261116/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hetongzhoudu-bottle-${{ github.run_id }}
          path: hetongzhoudu-bottle-output/
          retention-days: 7
