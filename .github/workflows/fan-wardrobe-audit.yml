name: Fan wardrobe model check
on:
  push:
    branches: [fan-hetongzhoudu-20261116]
    paths: [protoface/hetongzhoudu-clothes-20261116/audit-request.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx
      - name: Read model schemas and quota only
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/hetongzhoudu-clothes-20261116/audit.py
