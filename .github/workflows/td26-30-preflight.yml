name: Thirteen Doors 26-30 read-only price and funding check
on:
  push:
    paths: ['protoface/ep26-30/check-request.json']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --timeout 30 --retries 1 httpx==0.28.1 cryptography==50.0.0
      - name: Read model price and balance only
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep26-30/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: TD2630-price-${{ github.run_id }}
          path: protoface/ep26-30/preflight.sealed.json
          retention-days: 1
