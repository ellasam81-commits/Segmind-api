name: EP01 Wan 3.0 first segment - 480p
on:
  push:
    paths: ['protoface/ep01/wan3-trial-request.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r protoface/ep01/requirements.txt
      - name: Restore the accepted trial if this same run resumes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ep01-wan3-480p-checkpoint-${{ github.run_id }}
          path: protoface/ep01/wan3/checkpoint
      - name: Generate the single requested Wan 3.0 sample
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'true'
        run: python protoface/ep01/wan3_trial.py
      - name: Preserve the provider run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-wan3-480p-checkpoint-${{ github.run_id }}
          path: protoface/ep01/wan3/checkpoint
          overwrite: true
          if-no-files-found: ignore
      - name: Download the Wan 3.0 sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-wan3-480p-sample-${{ github.run_id }}
          path: |
            protoface/ep01/wan3/*.mp4
            protoface/ep01/wan3/prompt.txt
            protoface/ep01/wan3/completion.json
            protoface/ep01/wan3/wan3-contract.json
          if-no-files-found: ignore
