name: Thirteen Doors exact EP58 part12 dialogue repair02
on:
  push:
    paths: ['protoface/ep51-60-final/quality-repair02/episode-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: td5160-exact58-p12-repair02
  cancel-in-progress: false
jobs:
  one-confirmed-defect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TD_INPUT_REF: ${{ github.ref_name }}
      REVIEWED_REPAIR_PARTS: '12'
      REVIEWED_REPAIR_ID: ep58-p12-name-r02
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact single defect and eight-credit repair cap
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'protoface/ep51-60-final/quality-repair02')
          from config import EPISODES,PARTS,INITIAL_CLIP_COUNT,INITIAL_CREDITS,AUTHORIZED_INPUT_SHA256
          r=json.load(open('protoface/ep51-60-final/quality-repair02/episode-request.json'))
          assert EPISODES==(58,)and PARTS==(12,)and INITIAL_CLIP_COUNT==1 and INITIAL_CREDITS==8
          assert r['episode']==58 and r['parts']==[12]and r['request_kind']=='repair'
          assert r['repair_request_id']=='ep58-p12-name-r02'
          assert r['maximum_repair_batch_credits']==8 and r['maximum_additional_generations']==1
          assert r['authorized_input_sha256']==AUTHORIZED_INPUT_SHA256['58:12']
          PY
      - name: Prepare existing native media tools
        run: |
          python -m pip install --timeout 30 --retries 1 httpx==0.28.1 jsonschema==4.26.0 cryptography==50.0.0 imageio-ffmpeg==0.6.0
          python protoface/ep51-60-final/quality-repair02/install_media_tools.py
      - name: Read-only price check and ephemeral input channel
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep51-60-final/quality-repair02/series_runner.py init --episode 58 --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td5160-repair02-input'
      - name: Publish public input key and encrypted quote only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python protoface/ep51-60-final/quality-repair02/publish_ready.py 58 ${{ github.run_id }} '${{ github.repository }}' '${{ github.ref_name }}'
      - name: Receive exactly one encrypted approved repair packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python protoface/ep51-60-final/quality-repair02/series_runner.py receive --episode 58 --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td5160-repair02-input' --repository '${{ github.repository }}'
      - name: Generate exactly one native-audio replacement within eight credits
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'true'
        run: python protoface/ep51-60-final/quality-repair02/series_runner.py generate --episode 58 --parts 12
      - name: Seal output and accepted-request checkpoint
        if: always()
        run: python protoface/ep51-60-final/quality-repair02/series_runner.py seal --episode 58 --run-id ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TD5160-repair02-results-ep58-${{ github.run_id }}
          path: protoface/ep51-60-final/quality-repair02/sealed-results/ep58.sealed.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral plaintext and input key
        if: always()
        run: |
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP'])/'td5160-repair02-input',ignore_errors=True)
          shutil.rmtree(Path('protoface/ep51-60-final/quality-repair02/work/ep58'),ignore_errors=True)
          PY
