name: Thirteen Doors episodes 31-35 native five-second production
on:
  push:
    paths: ['protoface/ep31-35/generate-request.json']
  workflow_dispatch:
    inputs:
      episode:
        description: Select the authorized initial episode or all five
        type: choice
        required: true
        default: all
        options: ['all', '31', '32', '33', '34', '35']
permissions:
  contents: read
  actions: read
concurrency:
  group: thirteen-doors-ep31-35-initial
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.select.outputs.episodes }}
    steps:
      - id: select
        env:
          SELECT_EPISODE: ${{ inputs.episode || 'all' }}
        run: |
          python - <<'PY'
          import json, os
          choice = os.environ['SELECT_EPISODE']
          if choice not in ['all','31','32','33','34','35']:
              raise ValueError('Invalid episode choice')
          episodes = list(range(31,36)) if choice == 'all' else [int(choice)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('episodes=' + json.dumps(episodes, separators=(',',':')) + '\n')
          PY
  episode:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: ${{ fromJSON(needs.selection.outputs.episodes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bundled native media tools
        run: |
          python -m pip install --timeout 30 --retries 1 httpx==0.28.1 jsonschema==4.26.0 cryptography==50.0.0 imageio-ffmpeg==0.6.0
          python protoface/ep31-35/install_media_tools.py
      - name: Create encrypted input channel and verify live eight-credit price
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/ep31-35/series_runner.py init --episode ${{ matrix.episode }} --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td31-35-${{ matrix.episode }}'
      - uses: actions/upload-artifact@v4
        with:
          name: TD3135-ready-ep${{ matrix.episode }}-${{ github.run_id }}
          path: protoface/ep31-35/transport-public/ep${{ matrix.episode }}/
          retention-days: 1
      - name: Receive encrypted storyboards and private prompts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python protoface/ep31-35/series_runner.py receive --episode ${{ matrix.episode }} --run-id ${{ github.run_id }} --private-dir '${{ runner.temp }}/td31-35-${{ matrix.episode }}' --repository '${{ github.repository }}'
      - name: Generate native audio clips or resume accepted runs
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ALLOW_PAID_GENERATION: 'true'
        run: python protoface/ep31-35/series_runner.py generate --episode ${{ matrix.episode }}
      - name: Encrypt returned media and stable request checkpoints
        if: always()
        run: python protoface/ep31-35/series_runner.py seal --episode ${{ matrix.episode }} --run-id ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TD3135-results-ep${{ matrix.episode }}-${{ github.run_id }}
          path: protoface/ep31-35/sealed-results/ep${{ matrix.episode }}.sealed.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral plaintext and input key
        if: always()
        env:
          TD_EPISODE: ${{ matrix.episode }}
          TD_PRIVATE_DIR: ${{ runner.temp }}/td31-35-${{ matrix.episode }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          shutil.rmtree(os.environ['TD_PRIVATE_DIR'], ignore_errors=True)
          shutil.rmtree(Path('protoface/ep31-35/work') / ('ep' + os.environ['TD_EPISODE']), ignore_errors=True)
          PY
