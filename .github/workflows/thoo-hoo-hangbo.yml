name: T Hoo Hoo - 挂播动漫小剧场 (Protoface)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Free model inspection by default
        type: choice
        options: [inspect_model, check_connection, generate_range]
        default: inspect_model
      start_scene:
        description: First scene
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '1'
      end_scene:
        description: Last scene (choose 6 for complete 42-second video)
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '1'
      max_total_credits:
        description: Spending cap in provider credits, 0 blocks all paid runs
        type: number
        default: 0
      confirm_spend:
        description: Explicit authorization for charged generation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: thoo-hoo-hangbo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  drama:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r protoface/requirements.txt
      - name: Restore same-run checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: thoo-hoo-hangbo-${{ github.run_id }}
          path: thoo-hoo-hangbo-output
      - name: Install Chinese subtitle fonts and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Run only selected scenes
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
          ACTION: ${{ inputs.action }}
          START_SCENE: ${{ inputs.start_scene }}
          END_SCENE: ${{ inputs.end_scene }}
          MAX_TOTAL_CREDITS: ${{ inputs.max_total_credits }}
          CONFIRM_SPEND: ${{ inputs.confirm_spend }}
        run: python protoface/thoo-hoo-hangbo/run.py
      - name: Save videos, subtitles and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thoo-hoo-hangbo-${{ github.run_id }}
          path: thoo-hoo-hangbo-output/
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
