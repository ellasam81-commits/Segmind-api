name: Correct male-only sword fight
on:
  push:
    branches: [xie-rescue-wan-20261117]
    paths: [.github/workflows/xie-combat-only.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - name: Render male-only fight
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/xie-rescue/combat_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xie-combat-only
          path: output
