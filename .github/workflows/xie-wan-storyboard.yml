name: Xie Wan storyboard
on:
  push:
    branches: [fan-hetongzhoudu-20261116]
    paths: [protoface/xie-wan-storyboard-20261117/request.json]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - name: Wan storyboard
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/xie-wan-storyboard-20261117/runner.py
