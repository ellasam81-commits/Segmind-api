name: QQ Music fan theater performance
on:
  push:
    branches: [fan-theater-1111-black-shirt]
    paths: ['protoface/fan-theater-1111/start.json']
permissions:
  contents: write
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fan-theater-1111-black-shirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'cryptography>=42' 'httpx>=0.27,<1'
      - name: Render one referenced scene and return it privately
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/fan-theater-1111/runner.py
