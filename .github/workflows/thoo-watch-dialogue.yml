name: Record T Hoo Hoo dialogue
on:
  push:
    branches: [thoo-watch-replay-nov19]
    paths: ['.github/workflows/thoo-watch-dialogue.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          pip install -q edge-tts
          mkdir recordings
          python - <<'PY'
          import asyncio, edge_tts
          lines=["最近大家对AI二创有意见。","来，镜头对着我。","你们看我，我看谢却山。","他明明没有叛国呀……","呜，纸巾给我一张。","谁按的重播啊？！","谢却山，你等我擤完鼻子。"]
          async def main():
              for i,line in enumerate(lines):
                  rate=['+5%','+6%','+4%','-6%','-2%','+8%','-3%'][i]
                  pitch=['+6Hz','+7Hz','+7Hz','+1Hz','+2Hz','+10Hz','+3Hz'][i]
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(line,'zh-CN-XiaoyiNeural',rate=rate,pitch=pitch).save(f'recordings/{i}.mp3')
                          break
                      except Exception:
                          if attempt==2: raise
                          await asyncio.sleep(2)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watch-dialogue
          path: recordings/*.mp3
