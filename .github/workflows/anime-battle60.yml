name: Xie Queshan 60s anime battle
on:
  push:
    branches: [fan-hetongzhoudu-20261116]
    paths: [protoface/xie-anime-battle60-20261117/request.json]
permissions:
  contents: read
concurrency:
  group: xie-anime60-20261117
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q httpx jsonschema
      - name: Generate anime battle
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: python protoface/xie-anime-battle60-20261117/runner.py
