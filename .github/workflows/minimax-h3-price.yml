name: Inspect MiniMax H3 pricing
on:
  push:
    paths: ['.github/workflows/minimax-h3-price.yml']
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live pricing only
        env:
          PROTOFACE_API_KEY: ${{ secrets.PROTOFACE_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          req=urllib.request.Request('https://api.protoface.com/v1/models/minimax/minimax-h3',headers={'Authorization':'Bearer '+os.environ['PROTOFACE_API_KEY']})
          with urllib.request.urlopen(req,timeout=60) as response:body=json.load(response)
          open('minimax-h3-contract.json','w').write(json.dumps(body,ensure_ascii=False,indent=2))
          print(json.dumps({'id':body['id'],'available':body['available'],'pricing':body['pricing'],'output_quality_descriptions':body.get('output_quality_descriptions')},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minimax-h3-live-contract
          path: minimax-h3-contract.json
